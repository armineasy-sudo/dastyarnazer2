<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>همیار ناظر - چک‌لیست و گزارش</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0F172A">
</head>
<body>
  <header>
    <h1>همیار ناظر</h1>
    <p>دستیار نظارت تأسیسات مکانیکی</p>
  </header>

  <main>
    <section class="project-manager">
      <h2>مدیریت پروژه‌ها</h2>
      <div class="form-row">
        <select id="projectSelect"></select>
        <button id="newProjectBtn">پروژه جدید</button>
        <button id="deleteProjectBtn">حذف پروژه فعلی</button>
      </div>
    </section>

    <section class="project-info">
      <h2>اطلاعات پروژه فعلی</h2>
      <div class="form-row">
        <input type="text" id="projectName" placeholder="نام پروژه" />
        <input type="text" id="projectAddress" placeholder="آدرس پروژه" />
      </div>
      <div class="form-row">
        <input type="text" id="inspectorName" placeholder="نام ناظر" />
        <input type="text" id="visitDate" placeholder="تاریخ بازدید (مثال: 1405/09/04)" />
      </div>
    </section>

    <section class="iso-tool">
      <h2>ابزار ترسیم ایزومتریک گاز</h2>
      <div class="iso-controls">
        <button id="addPipeBtn">افزودن لوله مستقیم</button>
        <button id="addElbowBtn">افزودن زانویی ۹۰ درجه</button>
        <button id="addValveBtn">افزودن شیر</button>
        <button id="clearCanvasBtn">پاک کردن نقشه</button>
        <button id="saveIsoBtn">ذخیره نقشه در پروژه</button>
      </div>
      <canvas id="isoCanvas" width="600" height="400"></canvas>
      <p class="hint">با کلیک و کشیدن موس روی بوم، لوله مستقیم بکشید. ابزارها ساده هستند و برای شروع کار مناسب‌اند.</p>
    </section>

    <section class="controls">
      <input type="search" id="search" placeholder="جستجو در چک‌لیست..." autocomplete="off">
      <select id="categoryFilter">
        <option value="all">همه دسته‌ها</option>
        <option value="SAFETY">ایمنی</option>
        <option value="BEFORE_CONSTRUCTION">قبل از ساخت</option>
        <option value="DURING_CONSTRUCTION">حین ساخت</option>
        <option value="BEFORE_FINAL_APPROVAL">قبل از تأیید نهایی</option>
      </select>
      <select id="statusFilter">
        <option value="all">همه وضعیت‌ها</option>
        <option value="NOT_COMPLETED">بررسی‌نشده</option>
        <option value="COMPLETED">تأیید</option>
        <option value="REQUIRES_CORRECTION">نیاز به اصلاح</option>
      </select>
      <button id="printBtn">تولید / چاپ گزارش PDF</button>
    </section>

    <section id="checklist"></section>

    <section id="report" class="print-only">
      <h2>گزارش نظارت تأسیسات مکانیکی</h2>
      <div id="reportHeader"></div>
      <div id="reportContent"></div>
      <div id="reportSummary"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
